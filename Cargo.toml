[package]
name = "agentprompt"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["MukundaKatta"]
description = "LLM prompt templates with Jinja2 syntax. Render system/user/assistant turns into a typed message list, ready for the Anthropic or OpenAI SDK."
license = "MIT"
repository = "https://github.com/MukundaKatta/agentprompt-rs"
homepage = "https://github.com/MukundaKatta/agentprompt-rs"
documentation = "https://docs.rs/agentprompt"
readme = "README.md"
keywords = ["llm", "anthropic", "openai", "templates", "jinja"]
categories = ["template-engine", "api-bindings"]

[dependencies]
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
